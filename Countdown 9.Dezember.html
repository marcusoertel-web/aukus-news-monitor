<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVL // IPC Countdown - Dec 9, 2026</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(18, 24, 38, 0.75);
            --silver-accent: #c0c8d0;
            --baby-blue: #38bdf8;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 20%, #1e293b 0%, var(--bg-dark) 80%);
        }

        .countdown-container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 2.5rem 3rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 480px;
            width: 90%;
        }

        .header-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--baby-blue);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 1.5rem 0;
            color: var(--silver-accent);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 2rem;
        }

        .time-box {
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(192, 200, 208, 0.15);
            border-radius: 8px;
            padding: 12px 8px;
        }

        .time-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            font-family: monospace;
        }

        .time-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .target-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 1rem;
        }

        .target-date {
            color: var(--baby-blue);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="countdown-container">
        <div class="header-tag">Live Market Tracker</div>
        <h1>IPC DECISION COUNTDOWN</h1>
        
        <div class="timer-grid">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Tage</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Stunden</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minuten</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Sekunden</div>
            </div>
        </div>

        <div class="target-info">
            Stichtag: <span class="target-date">09. Dezember 2026</span><br>
            Physische Entkopplung & Infrastruktur-Trigger
        </div>
    </div>

    <script>
        // Ziel-Datum: 09. Dezember 2026, 00:00:00 Uhr
        const targetDate = new Date("December 9, 2026 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference < 0) {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
