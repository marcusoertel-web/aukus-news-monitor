<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUKUS News Monitor | IPC Decision Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.1);
            text-align: center;
        }

        .headline-tag {
            color: #38bdf8;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .portal-image-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            margin-bottom: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .portal-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .sub-header {
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .main-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: #f8fafc;
            letter-spacing: 1px;
            margin-bottom: 24px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .time-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px 8px;
        }

        .time-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #38bdf8;
            line-height: 1.1;
        }

        .time-label {
            font-size: 0.7rem;
            color: #64748b;
            letter-spacing: 1.5px;
            margin-top: 6px;
            text-transform: uppercase;
        }

        .footer-info {
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
        }

        .footer-info strong {
            color: #38bdf8;
        }

        @media (max-width: 600px) {
            .container { padding: 20px; }
            .main-title { font-size: 1.25rem; }
            .time-value { font-size: 1.6rem; }
            .headline-tag { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="headline-tag">🔥 Jungs, nur noch ein Schritt … 🔥</div>

    <div class="portal-image-container">
        <img src="portal.png" alt="NSW Planning Portal Status">
    </div>

    <div class="sub-header">Live Market Tracker</div>
    <div class="main-title">IPC DECISION COUNTDOWN</div>

    <div class="countdown-grid">
        <div class="time-card">
            <div class="time-value" id="days">00</div>
            <div class="time-label">Tage</div>
        </div>
        <div class="time-card">
            <div class="time-value" id="hours">00</div>
            <div class="time-label">Stunden</div>
        </div>
        <div class="time-card">
            <div class="time-value" id="minutes">00</div>
            <div class="time-label">Minuten</div>
        </div>
        <div class="time-card">
            <div class="time-value" id="seconds">00</div>
            <div class="time-label">Sekunden</div>
        </div>
    </div>

    <div class="footer-info">
        Stichtag: <strong>09. Dezember 2026</strong><br>
        Physische Entkopplung &amp; Infrastruktur-Trigger
    </div>
</div>

<script>
    const targetDate = new Date("December 9, 2026 00:00:00 UTC").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference > 0) {
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        } else {
            document.querySelector(".countdown-grid").innerHTML = "<h2 style='color:#38bdf8;'>MILESTONE REACHED</h2>";
        }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

</body>
</html>
